<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTRAGENÓMICA // PROPAGANDA</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #000000;
            --color-primary: #00ff41;
            --color-dim: #008f11;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-primary);
            font-family: 'VT323', monospace;
            padding: 2rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .back-link {
            color: var(--color-dim);
            text-decoration: none;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        h1 {
            border-bottom: 2px dashed var(--color-primary);
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
        }

        .menu-list {
            list-style: none;
            padding: 0;
        }

        .menu-item {
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        .menu-item a {
            color: var(--color-primary);
            text-decoration: none;
            transition: all 0.2s;
            display: block;
            padding: 10px;
            border: 1px solid transparent;
        }

        .menu-item a:hover {
            background: rgba(0, 255, 65, 0.1);
            border-left: 5px solid var(--color-primary);
            padding-left: 20px;
        }

        .desc {
            display: block;
            font-size: 1rem;
            color: var(--color-dim);
            margin-top: 5px;
            margin-left: 15px;
        }
    </style>
</head>

                <span class="desc">:: [RESTRINGIDO] Próximamente.</span>
            </a>
        </li>
    </ul>

</body>

</html>
